name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@v2

      - name: Build the web dashboard
        run: make web

      - name: Check version markers against the tag
        run: scripts/check-version.sh "$GITHUB_REF_NAME"

      - name: Build artifacts
        run: scripts/dist.sh "$GITHUB_REF_NAME"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --verify-tag --title "awp $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
