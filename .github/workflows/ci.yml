name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: oven-sh/setup-bun@v2

      - name: Build the web dashboard
        run: make web

      - name: Install Python dependencies
        run: python -m pip install cryptography

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'ed:"; echo "$unformatted"; exit 1
          fi

      - name: Web dashboard checks
        working-directory: web
        run: bun run typecheck && bun run lint

      - name: go vet
        run: go vet ./...

      - name: Go tests (race detector)
        run: go test -race ./...

      - name: Python peer tests
        run: make test-python

      - name: Go/Python interop
        run: make interop

      - name: Conformance suite against the Python peer
        run: make conformance

      - name: Cross-compile the release artifacts
        run: scripts/dist.sh 0.0.0-ci
