name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@v2

      - name: Build the web dashboard
        run: make web

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'ed:"; echo "$unformatted"; exit 1
          fi

      - name: Web dashboard checks
        working-directory: web
        run: bun run typecheck && bun run lint

      - name: go vet
        run: go vet ./...

      - name: Go tests (race detector)
        run: go test -race ./...

      - name: Cross-compile the release artifacts
        run: scripts/dist.sh 0.0.0-ci

  # The carriers that go through the internet. They depend on tailcat's
  # public DERP relays and on Cloudflare's quick tunnels, so they report
  # without blocking a merge.
  carriers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install cloudflared
        run: |
          curl -fsSL -o /usr/local/bin/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /usr/local/bin/cloudflared

      - name: tailcat and Cloudflare carriers
        run: make carriers
